turn_on:
  name: Turn on
  description: >-
    Turn on a Fabman resource. A mapping configured for the authenticated
    Home Assistant user takes precedence. If that user has no mapping, the
    API-key member is used and the optional member fields are ignored.
    Without an authenticated user context, optionally reassign the resulting
    usage to a member. Activation always uses the API account's permissions.
  target:
    entity:
      integration: fabman
      domain: switch
  fields:
    member_id:
      name: Member ID
      description: >-
        Numeric Fabman member ID. Used only without an authenticated Home
        Assistant user context.
      example: 12345
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
          step: 1
    email_address:
      name: Email address
      description: >-
        Exact Fabman member email address. Used only without an authenticated
        Home Assistant user context.
      example: member@example.com
      selector:
        text:
          type: email
